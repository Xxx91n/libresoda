# 最小检查：格式、静态检查（警告视为失败）、全部测试。票 sodahub-org/libresoda#4。
# 末尾还有一步快路径计时记录（票 #28），不进门禁；口径见 `docs/PORTING.md`「计时凭证」一条。
# job 名 `fmt / clippy / test` 保持不变：改名等于改分支保护里那个必需检查的名字。
# 另有非必需 job `windows / clippy, test`（票 #25，Job Object 代码只能在 Windows 上编译；
# rustfmt 输出不分平台，格式检查只在上面那个必需 job 里跑）。
#
# 版本都钉在这个文件里，不写 `rust-toolchain.toml`：后者会改掉每个人本地构建用的工具链，
# 而这里只该固定 CI 自己的环境。镜像与 action 按提交钉住，同一个运行结果可复现、可追溯。
# 联网测试全部带 `#[ignore]`，`cargo test` 不会碰网络。
#
# 注意 `clippy`/`test` 都带 `--locked`，而 AGENTS.md 与 README 的「提交前必须」那三条没写
# —— 这处三边不一致是已知欠账，改规则文件要单独取授权。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    env:
      RUST: 1.99.0
    steps:
      # actions/checkout v7.0.1，按提交固定。`persist-credentials: false`：`pull_request` 触发的
      # 这一轮跑的是贡献者的代码（`cargo` 会执行 build script），而 checkout 默认把 token 写进
      # 本地 git 配置 —— 权限只有 `contents: read` 也不该让它被读出来。本仓库没有 git 依赖，
      # 去掉不影响拉取。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: |
          rustup toolchain install "$RUST" -c rustfmt -c clippy --profile minimal
          rustup default "$RUST"

      - name: Verify pinned toolchain
        run: |
          rustc -V && cargo -V && cargo clippy --version
          test "$(rustc -V | awk '{print $2}')" = "$RUST"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Static check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # 票 sodahub-org/libresoda#28：快路径延迟的计时记录 —— 把 `child_poll_probe` 那张
      # 「库路径 vs 裸 spawn」的 p50 差值表打进日志。表怎么读、为什么不进门禁，只写在
      # `docs/PORTING.md`「计时凭证」一条，这里不复述。
      # 这一步恒退 0（末尾那个 `|| echo` 就是「不门禁」的机制，所以不必再写
      # `continue-on-error`，写了也永远轮不到）。`timeout 300` 兜住「挂住」：Actions 的
      # `timeout-minutes` 只能挂在 job 上，而裸 `wait_with_output` 那一列真卡住时整个 job
      # 会被拖到默认时限；它掐的是 cargo 这一层。没跑出表就落一条 ::warning，
      # 凭证不至于静默消失。
      - name: Child poll timing record
        run: |
          timeout 300 cargo run --locked --example child_poll_probe || \
            echo '::warning::本次没有交出计时表（timeout 300 到点，或非 0 退出）'

  # 票 sodahub-org/libresoda#25：进程树终止在 Windows 走 Job Object，那条路径只能在
  # Windows 上编译与执行。与必需的 `fmt / clippy / test` 分开命名 —— 分支保护只认那一个
  # 名字；这个 job 不进必需检查，但失败会在 PR 上显形。
  # 用 `shell: bash`：Git Bash 在 windows runner 上自带，现有离线用例依赖它提供的 `sh`，
  # 安装校验两步里的 `test` / `awk` 也是 POSIX 写法。
  windows:
    name: windows / clippy, test
    runs-on: windows-latest
    # `windows-latest` 按倍数计价；挂住时别一路跑到 Actions 默认时限。
    timeout-minutes: 20
    env:
      RUST: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST" -c clippy --profile minimal
          rustup default "$RUST"

      - name: Verify pinned toolchain
        shell: bash
        run: |
          rustc -V && cargo -V && cargo clippy --version
          test "$(rustc -V | awk '{print $2}')" = "$RUST"

      # 不重复 `cargo fmt --check`：rustfmt 输出不分平台，Ubuntu 那个必需 job 已经在门禁。

      - name: Static check
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked
