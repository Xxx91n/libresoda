# 本文件只属于 fork 的 ci/verify 分支：它是本次工作的验证手段，不是仓库产物。
# 合入上游前必须删掉它——上游 PR 里不含任何 CI 配置文件（见 sodahub-org/libresoda#4）。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    env:
      RUST: 1.99.0
    steps:
      # actions/checkout v7.0.1，按提交固定：同一个运行结果可复现、可追溯。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 工具链在这里钉住，而不是写进 rust-toolchain.toml：
      # 后者是全仓库产物改动，要进上游 PR，而本文件不允许。
      - name: Install pinned toolchain
        run: |
          rustup toolchain install "$RUST" -c rustfmt -c clippy --profile minimal
          rustup default "$RUST"

      - name: Verify pinned toolchain
        run: |
          rustc -V && cargo -V && cargo clippy --version
          rustup show active-toolchain | grep -F "${RUST}-"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Static check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
