# 本文件只属于 fork（Xxx91n/libresoda）的 ci/verify 分支：它是本次工作的验证手段，
# 不是仓库产物。合入上游前必须删掉它——上游 PR 里不含任何 CI 配置文件（见 issue #4）。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1，按提交固定：同一个运行结果可复现、可追溯。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Record toolchain versions
        run: rustc -V && cargo -V && cargo clippy --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Static check
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
