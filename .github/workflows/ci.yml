name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Static check
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
